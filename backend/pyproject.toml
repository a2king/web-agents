[project]
name = "web-agents-backend"
version = "0.1.0"
description = "Web Agents backend"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.0",
    "flask-cors==5.0.1",
    "flask-jwt-extended==4.7.1",
    "flask-sqlalchemy==3.1.1",
    "sqlalchemy==2.0.36",
    "pymysql==1.1.1",
    "cryptography==44.0.0",
    "redis==5.2.1",
    "rq==2.1.0",
    "bcrypt==4.2.1",
    "python-dotenv==1.0.1",
    "pydantic==2.10.4",
    "croniter==5.0.1",
    "httpx==0.28.1",
    "langchain-core==0.3.28",
    "langchain-openai==0.2.14",
    "langgraph==0.2.60",
    "openai==1.58.1",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-flask==1.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
